name: Publish

# Publie sur npm puis sur le registre MCP officiel quand une release GitHub
# est publiée. La version publiée est celle de package.json / server.json —
# pense à les bumper AVANT de créer la release (cf. CONTRIBUTING.md).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Requis pour l'authentification OIDC auprès du registre MCP (namespace
      # io.github.*) ET pour npm provenance.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install (clean)
        run: npm ci

      - name: Build + smoke test
        run: npm test

      # 1) Publication npm (avec provenance — traçabilité build → package).
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2) Publication au registre MCP officiel via OIDC GitHub (pas de secret).
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Login + publish to MCP registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
